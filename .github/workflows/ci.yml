name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NEXT_TELEMETRY_DISABLED: "1"
  # No GEMINI_API_KEY / UPSTASH_* on purpose: CI proves the app works fully
  # in offline/rule-based fallback mode with zero API keys, exactly like a
  # reviewer running the demo locally. See README "How to verify".

jobs:
  lint-typecheck-test:
    name: Lint, typecheck, unit/integration tests, contrast, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: WCAG AA contrast check (AQI color pairs)
        run: npm run check:contrast

      - name: Unit + integration tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: npm audit (fail on high/critical severity)
        run: npm audit --audit-level=high

  e2e:
    name: Playwright E2E + axe accessibility
    runs-on: ubuntu-latest
    needs: lint-typecheck-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
